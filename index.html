<!DOCTYPE html>
<html lang="en">
<head>
  <title>Dom's Animation Portfolio</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<body>
<H1>
    About Dom
</H1>
    <p>This is a website to document all the animation progress I make. It's not really exciting, more for me.</p>
<div class="container">
<h2>Puff the Cloud Carousel</h2>  
  <div id="myCarousel" class="carousel slide" data-ride="carousel">
    <!-- Indicators -->
    <ol class="carousel-indicators">
      <li data-target="#myCarousel" data-slide-to="0" class="active"></li>
      <li data-target="#myCarousel" data-slide-to="1"></li>
        <li data-target="#myCarousel" data-slide-to="2"></li>
        <li data-target="#myCarousel" data-slide-to="3"></li>
        <li data-target="#myCarousel" data-slide-to="4"></li>
        <li data-target="#myCarousel" data-slide-to="5"></li>
    </ol>

    <!-- Wrapper for slides -->
      <div class="item">
        <source src="Test1.mp4" type="video/mp4" style="width:100%;">
      </div>
    </div>
    
      <div class="item">
        <source src="Ep2.mp4" type="video/mp4" style="width:100%;">
      </div>
    </div>
    <div class="item">
        <source src="Ep3.mp4" type="video/mp4" style="width:100%;">
      </div>
    </div>
    
      <div class="item">
        <source src="Ep4.mp4" type="video/mp4" style="width:100%;">
      </div>
    </div>
        <div class="item">
        <source src="Ep5.mp4" type="video/mp4" style="width:100%;">
      </div>
    </div>
    
      <div class="item">
        <source src="Ep6.mp4" type="video/mp4" style="width:100%;">
      </div>
    </div>

    <!-- Left and right controls -->
    <a class="left carousel-control" href="#myCarousel" data-slide="prev">
      <span class="glyphicon glyphicon-chevron-left"></span>
      <span class="sr-only">Previous</span>
    </a>
    <a class="right carousel-control" href="#myCarousel" data-slide="next">
      <span class="glyphicon glyphicon-chevron-right"></span>
      <span class="sr-only">Next</span>
    </a>
  </div>
</div>
    <br>
    <hr>
    <br>
  <h2>Random Animation Carousel</h2>  
  <div id="randCarousel" class="carousel slide" data-ride="carousel">
    <!-- Indicators -->
    <ol class="carousel-indicators">
      <li data-target="#randCarousel" data-slide-to="0" class="active"></li>
      <li data-target="#randCarousel" data-slide-to="1"></li>
    </ol>

    <!-- Wrapper for slides -->
      <div class="item">
        <source src="Rocket01.mp4" type="video/mp4" style="width:100%;">
      </div>
    </div>
    
      <div class="item">
        <source src="Rocket02.mp4" type="video/mp4" style="width:100%;">
      </div>
    </div>

    <!-- Left and right controls -->
    <a class="left carousel-control" href="#randCarousel" data-slide="prev">
      <span class="glyphicon glyphicon-chevron-left"></span>
      <span class="sr-only">Previous</span>
    </a>
    <a class="right carousel-control" href="#randCarousel" data-slide="next">
      <span class="glyphicon glyphicon-chevron-right"></span>
      <span class="sr-only">Next</span>
    </a>
  </div>
</div>

</body>
</html>
