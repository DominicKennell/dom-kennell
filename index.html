<!DOCTYPE html>
<html lang="en">
<head>
  <title>Dom's Animation Portfolio</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Google Fonts for clean typography -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 40px 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    section {
      margin-bottom: 60px;
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 24px;
      border-left: 4px solid var(--accent-color);
      padding-left: 12px;
      color: var(--text-main);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      background: #000;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
    }

    .card-body {
      padding: 16px 20px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
    }

    hr {
      border: none;
      height: 1px;
      background-color: #334155;
      margin: 40px 0;
    }

    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 60px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>

  </header>
